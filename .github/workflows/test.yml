name: test

on:
  push:
  pull_request:

permissions:
  contents: read

# Lint and tests are separate jobs so a lint failure never hides test results.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .

  # Citation metadata: both CITATION.cff files against the CFF schema. .zenodo.json is
  # checked by tests/test_metadata.py in the test job.
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Validate CITATION.cff
        run: |
          uvx --from cffconvert==2.0.0 cffconvert --validate -i CITATION.cff
          uvx --from cffconvert==2.0.0 cffconvert --validate -i release/leverrier-table77/CITATION.cff

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Fast tests
        # No network calls: every Horizons state comes from tests/fixtures/horizons (a copy, via
        # tests/conftest.py) and a live fetch raises. The live client is tested by the
        # `network` workflow (weekly and on demand).
        run: uv run pytest -m "not slow and not network"
