name: test

on:
  push:
  pull_request:

# Lint and tests are separate jobs so a lint failure never hides test results.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no floating major tag
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no floating major tag
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Fast tests
        # No network calls: every Horizons state comes from tests/fixtures/horizons (a copy, via
        # tests/conftest.py) and a live fetch raises. The live client is tested by the
        # `network` workflow (weekly and on demand).
        run: uv run pytest -m "not slow and not network"
