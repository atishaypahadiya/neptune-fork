name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only by default; only the deploy job can publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read  # configure-pages reads the site's settings (base URL)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      # site/data/*.json is committed (regenerated locally via `fork.export.to_json`). The build
      # prerenders site/ in headless Chrome so the page reads without JavaScript, then checks it
      # (number audit with JS off, identical to the JS page; head tags; Plate I image). Only the
      # `site` dependency group (Playwright) is installed; the runner's Google Chrome is used,
      # or Playwright's Chromium where there is none.
      - name: Install Playwright
        run: |
          uv sync --locked --only-group site
          test -x /opt/google/chrome/chrome || uv run --no-sync playwright install --with-deps chromium
      - name: Prerender
        run: uv run --no-sync python tools/prerender_site.py --out _site --base-url "${{ steps.pages.outputs.base_url }}/"
      - name: Check the prerendered page
        run: uv run --no-sync python tools/check_prerender.py _site --base-url "${{ steps.pages.outputs.base_url }}/"
      # Layout, print and interaction at 390-1440 px: no text over a mark, no label longer than
      # its path, no emoji, nothing sticky below 900 px, every figure, plate and table on the
      # grid lines of its width (docs/DESIGN.md, Acceptance 2 and 3, and "Widths").
      - name: Check the layout
        run: uv run --no-sync python tools/check_layout.py _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0; wraps upload-artifact@v7 (node24)
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
