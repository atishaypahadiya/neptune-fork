name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no floating major tag
        with:
          enable-cache: true
      # site/data/*.json is committed (regenerated locally via `fork.export.to_json`). The build
      # prerenders site/ in headless Chrome so the page reads without JavaScript, then checks it
      # (number audit with JS off, identical to the JS page; head tags; Plate I image). Only the
      # `site` dependency group (Playwright) is installed; the runner's Google Chrome is used,
      # or Playwright's Chromium where there is none.
      - name: Install Playwright
        run: |
          uv sync --locked --only-group site
          test -x /opt/google/chrome/chrome || uv run --no-sync playwright install --with-deps chromium
      - name: Prerender
        run: uv run --no-sync python tools/prerender_site.py --out _site --base-url "${{ steps.pages.outputs.base_url }}/"
      - name: Check the prerendered page
        run: uv run --no-sync python tools/check_prerender.py _site --base-url "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5  # wraps upload-artifact@v7 (node24)
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
