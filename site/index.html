<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>neptune-fork</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="Le Verrier's 1846 prediction of Neptune, rebuilt from his own data as a calibrated Bayesian inference.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500&family=EB+Garamond:ital@1&display=swap">
  <link rel="stylesheet" href="css/site.css">
  <script type="importmap">
    {"imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }}
  </script>
</head>
<body>
  <main>
    <section class="scene" id="headline" aria-labelledby="headline-title">
      <canvas aria-hidden="true"></canvas>
      <svg class="leaders" aria-hidden="true"></svg>

      <div class="copy">
        <p class="chapter">Where to look</p>
        <h1 id="headline-title">Le Verrier's data</h1>
        <p class="body">Loading the results…</p>
      </div>


      <div class="labels" aria-hidden="true">
        <div class="anno" data-anchor="neptune"><p class="t"></p><p class="s"></p></div>
        <div class="anno" data-anchor="median"><p class="t"></p><p class="s"></p></div>
        <div class="anno hoverable has-short" data-anchor="lv"><p class="t"></p><p class="s"></p><p class="ts"></p></div>
        <div class="anno" data-anchor="planet"><p class="t"></p><p class="s s1"></p><p class="s s2"></p></div>
        <div class="ticks"></div>
        <p class="tip" hidden></p>
      </div>

      <p class="axis-title" aria-hidden="true"></p>
      <p class="equation" aria-label="Bayes: the posterior for the longitude is proportional to the likelihood times the prior, integrated over the other parameters"><i>p</i>(λ | data) ∝ ∫ <i>L</i>(data | θ) π(θ) dθ</p>


      <p class="alt sr-only"></p>
      <p class="error" hidden></p>
    </section>

    <section class="scene" id="conjunction" aria-labelledby="conjunction-title">
      <canvas aria-hidden="true"></canvas>
      <svg class="leaders" aria-hidden="true"></svg>

      <div class="copy">
        <p class="chapter">What the data measured</p>
        <h2 id="conjunction-title">The data</h2>
        <p class="body">Loading the results…</p>
        <p class="note"></p>
      </div>

      <div class="labels" aria-hidden="true">
        <div class="anno right" data-anchor="conj"><p class="t"></p><p class="s"></p></div>
        <div class="anno" data-anchor="galle"><p class="t"></p><p class="s"></p></div>
        <div class="anno has-short" data-anchor="inner"><p class="t"></p><p class="s"></p><p class="ts"></p></div>
        <div class="anno right has-short" data-anchor="outer"><p class="t"></p><p class="s"></p><p class="ts"></p></div>
        <div class="anno" data-anchor="lv"><p class="t"></p><p class="s"></p></div>
        <div class="anno right" data-anchor="nep"><p class="t"></p><p class="s"></p></div>
        <div class="anno quiet" data-anchor="ribbon"><p class="t"></p></div>
        <div class="ticks"></div>
        <p class="tip" hidden></p>
      </div>

      <p class="equation" aria-label="The spread in longitude grows with time: minus three halves times the mean motion, times the relative spread in semi-major axis, times the time since the conjunction">δλ(<i>t</i>) ≈ −<sup>3</sup>⁄<sub>2</sub> <i>n</i> (δ<i>a</i> / <i>a</i>) (<i>t</i> − <i>t</i><sub>c</sub>)</p>

      <p class="alt sr-only"></p>
      <p class="error" hidden></p>
    </section>

    <section class="scene" id="window" aria-labelledby="window-title">
      <canvas aria-hidden="true"></canvas>
      <svg class="leaders" aria-hidden="true"></svg>

      <div class="copy">
        <p class="chapter">The lucky window</p>
        <h2 id="window-title">Le Verrier's planet</h2>
        <p class="body">Loading the results…</p>
        <p class="note"></p>
      </div>

      <div class="labels" aria-hidden="true">
        <div class="anno right has-short" data-anchor="s1836"><p class="t"></p><p class="s"></p><p class="ts"></p></div>
        <div class="anno right has-short" data-anchor="zero"><p class="t"></p><p class="s"></p><p class="ts"></p></div>
        <div class="anno has-short" data-anchor="galle"><p class="t"></p><p class="s"></p><p class="ts"></p></div>
        <div class="anno has-short" data-anchor="s1856"><p class="t"></p><p class="s"></p><p class="ts"></p></div>
        <div class="anno has-short" data-anchor="lvp"><p class="t"></p><p class="s"></p><p class="ts"></p></div>
        <div class="anno has-short" data-anchor="nep"><p class="t"></p><p class="s"></p><p class="ts"></p></div>
        <div class="anno quiet" data-anchor="b68"><p class="t"></p></div>
        <div class="anno quiet" data-anchor="b95"><p class="t"></p></div>
        <div class="anno has-short" data-anchor="window"><p class="t"></p><p class="ts"></p></div>
        <div class="anno quiet" data-anchor="ahead"><p class="t"></p></div>
        <div class="anno quiet" data-anchor="behind"><p class="t"></p></div>
        <div class="ticks"></div>
        <p class="tip" hidden></p>
      </div>

      <p class="equation" aria-label="Le Verrier's offset changes at the difference of the two mean motions times the time elapsed; the mean motion is the square root of G M over a cubed">Δλ(<i>t</i>) ≈ (<i>n</i><sub>LV</sub> − <i>n</i>)(<i>t</i> − <i>t</i><sub>0</sub>),  <i>n</i> = √(<i>GM</i> / <i>a</i><sup>3</sup>)</p>

      <p class="alt sr-only"></p>
      <p class="error" hidden></p>
    </section>
  </main>
  <div class="grain" aria-hidden="true"></div>

  <script type="module">
    import { loadConjunction, loadHeadline, loadWindow } from "./js/data.js";
    import { fillHeadline, mountHeadline } from "./js/scene-headline.js";
    import { fillConjunction, mountConjunction } from "./js/scene-conjunction.js";
    import { fillWindow, mountWindow } from "./js/scene-window.js";
    // Each panel loads its own data and fails on its own, with a visible message.
    const panels = [
      ["headline", loadHeadline, fillHeadline, mountHeadline],
      ["conjunction", loadConjunction, fillConjunction, mountConjunction],
      ["window", loadWindow, fillWindow, mountWindow],
    ];
    await Promise.all(panels.map(async ([id, load, fill, mount]) => {
      const root = document.getElementById(id);
      try {
        const d = await load();
        fill(root, d);
        mount(root, d);
        root.classList.add("ready");
      } catch (err) {
        const e = root.querySelector(".error");
        e.hidden = false;
        e.textContent = `Could not load the results: ${err.message}`;
        console.error(err);
      }
    }));
  </script>
</body>
</html>
